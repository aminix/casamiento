<!-- Imagen para compartir el enlace (og-image.png). Para regenerarla: abrir este archivo y hacer una captura de 1200×630 px. -->
<style>
:root {
  --red: #E3161E; --red-deep: #9E0D12; --white: #FFFFFF; --blush: #FFF5F3; --petal: #F2CFC9; --ink: #2A0A0B;
  --serif: "Fraunces", Georgia, serif; --display: "Bricolage Grotesque", sans-serif;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width: 1200px; height: 630px; overflow: hidden; }
body { background: var(--blush); position: relative; -webkit-font-smoothing: antialiased; }
.card {
  position: absolute; inset: 38px 46px;
  background: var(--white);
  border: 2px solid var(--red);
  outline: 1px solid var(--red); outline-offset: -13px;
  box-shadow: 0 30px 60px -30px rgba(158,13,18,.35);
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  text-align: center; color: var(--red);
}
.branch { position: absolute; width: 226px; aspect-ratio: 230 / 100; }
.branch.tl { top: 30px; left: 34px; transform: rotate(-8deg); }
.branch.br { bottom: 30px; right: 34px; transform: rotate(172deg); }
.names {
  color: var(--ink); font-family: var(--serif); font-weight: 400;
  font-variation-settings: "opsz" 144;
  font-size: 112px; line-height: .9; letter-spacing: -.02em;
}
.names span { display: block; }
.names .amp { font-style: italic; font-weight: 300; color: var(--red); font-size: .6em; line-height: 1; margin: .02em 0 .05em; }
.date-num {
  color: var(--ink); font-family: var(--display); font-weight: 800;
  font-variation-settings: "opsz" 96, "wdth" 75;
  font-size: 42px; letter-spacing: .02em; line-height: 1; margin-top: 22px;
}
.when {
  display: inline-flex; align-items: center; gap: 18px;
  margin-top: 16px; padding-top: 14px; border-top: 1px solid rgba(227,22,30,.35);
  font-family: var(--display); font-weight: 700; letter-spacing: .14em; text-transform: uppercase; font-size: 15px;
}
.when .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--red); }
</style>
</head>
